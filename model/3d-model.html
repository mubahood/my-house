<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My House - 3D concept model</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9ebee; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #panel { position: absolute; top: 16px; left: 16px; width: 250px; background: rgba(255,255,255,.94); border-radius: 12px;
           padding: 16px 16px 12px; box-shadow: 0 4px 18px rgba(0,0,0,.12); color: #1c1c1c; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .sub { font-size: 12px; color: #6b6b6b; margin: 0 0 12px; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8a8a8a; margin: 10px 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { border: 1px solid #1c1c1c; background: #fff; color: #1c1c1c; border-radius: 6px; padding: 6px 9px; font-size: 12.5px; cursor: pointer; }
  button.on, button:hover { background: #1c1c1c; color: #fff; }
  .note { font-size: 11.5px; color: #6b6b6b; margin: 12px 0 0; line-height: 1.4; }
  #help { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #555;
          background: rgba(255,255,255,.85); padding: 6px 12px; border-radius: 20px; }
  #nav { position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
  #nav button { width: 42px; height: 42px; padding: 0; font-size: 19px; line-height: 1; border-radius: 50%;
                background: rgba(255,255,255,.94); box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  #nav button.on, #nav button:hover { background: #1c1c1c; color: #fff; }
  #nav .gap { height: 6px; }
  button { transition: background .15s, color .15s; }
</style>
</head>
<body>
<div id="panel">
  <h1>My House</h1>
  <p class="sub">3D concept model · white, grey and black</p>

  <div class="label">Views</div>
  <div class="row">
    <button data-view="front">Front</button>
    <button data-view="bird">Bird's eye</button>
    <button data-view="back">Back</button>
    <button data-view="hall">Living hall</button>
    <button data-view="gallery">From the gallery</button>
    <button data-view="planG">Ground floor plan</button>
    <button data-view="planU">Upper floor plan</button>
  </div>

  <div class="label">Show</div>
  <div class="row">
    <button id="tRoof" class="on">Roof</button>
    <button id="tUpper" class="on">Upper floor</button>
    <button id="tLabels">Room names</button>
    <button id="tNight">Night</button>
  </div>

  <div class="label">Animate</div>
  <div class="row">
    <button id="bTour">&#9654; Play tour</button>
    <button id="tOpen">Open the floors</button>
  </div>

  <p class="note">The layout follows the written description and site photos. Sizes are estimates until the builder's plan is used.</p>
</div>
<div id="help">Drag to turn · scroll to zoom · right drag to move</div>
<div id="nav" aria-label="Camera controls">
  <button id="bIn" title="Zoom in (+)" aria-label="Zoom in">+</button>
  <button id="bOut" title="Zoom out (-)" aria-label="Zoom out">&minus;</button>
  <div class="gap"></div>
  <button id="bLeft" title="Turn left (left arrow)" aria-label="Turn left">&#8634;</button>
  <button id="bRight" title="Turn right (right arrow)" aria-label="Turn right">&#8635;</button>
  <button id="bSpin" title="Turn slowly on its own" aria-label="Auto turn">&#10227;</button>
  <div class="gap"></div>
  <button id="bHome" title="Back to the front view" aria-label="Front view">&#8962;</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ------------------------------------------------------------------ the main heights (metres)
const PLINTH = 0.75;            // raised base, five steps of 15 cm
const GF_H = 3.2;               // ground floor storey
const SLAB = 0.25;              // upper floor slab
const UF_H = 3.0;               // upper floor storey
const UF = PLINTH + GF_H + SLAB;  // upper floor level = 4.2
const TOP = UF + UF_H;            // roof level = 7.2
const W = 16.5, D = 12;           // footprint: x 0..16.5 (left to right), z 0..12 (back to front)

// ------------------------------------------------------------------ colours
const C = {
  wall: 0xf3f3f0, wallIn: 0xfafaf8, grey: 0x9b9d9f, greyDark: 0x5c5f63, black: 0x1b1b1c,
  floor: 0xd9d9d5, floorUp: 0xe2e1dc, tile: 0xcfd0cd, glass: 0x9fb3bf, ground: 0xc9cfc4, grass: 0x9fb48c, wood: 0x2a2a2b
};
const mat = {};
function m(color, extra) {
  const k = color + JSON.stringify(extra || {});
  if (!mat[k]) mat[k] = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.85, metalness: 0.0 }, extra || {}));
  return mat[k];
}
const GLASS = new THREE.MeshStandardMaterial({ color: C.glass, roughness: 0.1, metalness: 0.2, transparent: true, opacity: 0.45 });

// ------------------------------------------------------------------ scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ec);
scene.fog = new THREE.Fog(0xdfe6ec, 60, 140);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;

const hemi = new THREE.HemisphereLight(0xffffff, 0xb9b3a8, 1.1); scene.add(hemi);
const amb = new THREE.AmbientLight(0xffffff, 0.35); scene.add(amb);
const ROOM_LIGHTS = [];
// soft room lights, so the inside views are not dark under the roof
[[3.75, 6.6, 4.5, 26], [3.75, 3.6, 10.5, 10], [9.2, 3.6, 2.0, 8], [12.8, 3.6, 4.5, 10], [5.0, 6.8, 10.5, 10], [13.5, 6.8, 5.0, 12], [13.7, 6.8, 10.5, 8]]
  .forEach(([x, y, z, i]) => { const l = new THREE.PointLight(0xfff4e6, i, 14, 1.6); l.position.set(x, y, z); l.userData.day = i; scene.add(l); ROOM_LIGHTS.push(l); });
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(18, 28, 22);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25, near: 1, far: 80 });
sun.target.position.set(8, 0, 6);
scene.add(sun, sun.target);

const G = { site: new THREE.Group(), ground: new THREE.Group(), upper: new THREE.Group(), roof: new THREE.Group(),
            labelsG: new THREE.Group(), labelsU: new THREE.Group() };
Object.values(G).forEach(g => scene.add(g));

// ------------------------------------------------------------------ helpers
function box(g, x0, x1, y0, y1, z0, z1, color, opts) {
  const geo = new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0));
  const mesh = new THREE.Mesh(geo, opts && opts.material ? opts.material : m(color));
  mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  mesh.castShadow = !(opts && opts.noShadow);
  mesh.receiveShadow = true;
  g.add(mesh);
  return mesh;
}

// A straight wall along x (z fixed) or along z (x fixed), with openings.
// opening: { at: distance of its centre from the start, w, y0, y1 (relative to wall base), kind: 'window' | 'door' | 'gap' | 'glassdoor' }
function wall(g, x0, z0, x1, z1, base, h, t, openings, color) {
  color = color || C.wall;
  const alongX = Math.abs(z1 - z0) < 1e-6;
  const L = alongX ? Math.abs(x1 - x0) : Math.abs(z1 - z0);
  const s0 = alongX ? Math.min(x0, x1) : Math.min(z0, z1);
  const fixed = alongX ? z0 : x0;
  const piece = (a, b, ya, yb, col, material) => {
    if (b - a < 1e-3 || yb - ya < 1e-3) return;
    if (alongX) box(g, s0 + a, s0 + b, base + ya, base + yb, fixed - t / 2, fixed + t / 2, col, { material });
    else box(g, fixed - t / 2, fixed + t / 2, base + ya, base + yb, s0 + a, s0 + b, col, { material });
  };
  const ops = (openings || []).map(o => Object.assign({ y0: 0, y1: 2.1, kind: 'window' }, o))
                              .sort((a, b) => a.at - b.at);
  let cur = 0;
  ops.forEach(o => {
    const a = o.at - o.w / 2, b = o.at + o.w / 2;
    piece(cur, a, 0, h, color);
    piece(a, b, o.y1, h, color);          // above the opening
    piece(a, b, 0, o.y0, color);          // below it (window sill wall)
    const f = 0.05;                        // black frame
    if (o.kind === 'window' || o.kind === 'glassdoor') {
      piece(a, a + f, o.y0, o.y1, C.black); piece(b - f, b, o.y0, o.y1, C.black);
      piece(a, b, o.y1 - f, o.y1, C.black); piece(a, b, o.y0, o.y0 + f, C.black);
      if (o.w > 1.6) piece(o.at - f / 2, o.at + f / 2, o.y0, o.y1, C.black); // a centre mullion on wide openings
      const gl = (aa, bb) => {
        if (alongX) box(g, s0 + aa, s0 + bb, base + o.y0 + f, base + o.y1 - f, fixed - 0.01, fixed + 0.01, 0, { material: GLASS, noShadow: true });
        else box(g, fixed - 0.01, fixed + 0.01, base + o.y0 + f, base + o.y1 - f, s0 + aa, s0 + bb, 0, { material: GLASS, noShadow: true });
      };
      gl(a + f, b - f);
    } else if (o.kind === 'door') {
      if (alongX) box(g, s0 + a + 0.03, s0 + b - 0.03, base, base + o.y1 - 0.02, fixed - 0.025, fixed + 0.025, C.black);
      else box(g, fixed - 0.025, fixed + 0.025, base, base + o.y1 - 0.02, s0 + a + 0.03, s0 + b - 0.03, C.black);
    }
    cur = b;
  });
  piece(cur, L, 0, h, color);
}

// black railing: top rail, bottom rail and thin bars every 11 cm (gaps under 10 cm)
function railing(g, x0, z0, x1, z1, y, h) {
  h = h || 1.05;
  const alongX = Math.abs(z1 - z0) < 1e-6;
  const L = alongX ? Math.abs(x1 - x0) : Math.abs(z1 - z0);
  const s0 = alongX ? Math.min(x0, x1) : Math.min(z0, z1);
  const fix = alongX ? z0 : x0;
  const r = (a, b, ya, yb, w) => alongX ? box(g, s0 + a, s0 + b, ya, yb, fix - w, fix + w, C.black, { noShadow: true })
                                        : box(g, fix - w, fix + w, ya, yb, s0 + a, s0 + b, C.black, { noShadow: true });
  r(0, L, y + h - 0.05, y + h, 0.03);
  r(0, L, y + 0.08, y + 0.11, 0.015);
  const n = Math.max(2, Math.round(L / 0.11));
  const geo = new THREE.BoxGeometry(alongX ? 0.018 : 0.018, h - 0.13, 0.018);
  const inst = new THREE.InstancedMesh(geo, m(C.black), n + 1);
  const mtx = new THREE.Matrix4();
  for (let i = 0; i <= n; i++) {
    const s = s0 + (L * i) / n;
    mtx.makeTranslation(alongX ? s : fix, y + 0.11 + (h - 0.16) / 2, alongX ? fix : s);
    inst.setMatrixAt(i, mtx);
  }
  g.add(inst);
}

function label(g, text, x, y, z, sub) {
  const cv = document.createElement('canvas');
  const sc = 2; cv.width = 512 * sc; cv.height = 128 * sc;
  const c = cv.getContext('2d');
  c.scale(sc, sc);
  c.font = '600 34px system-ui, -apple-system, Segoe UI, sans-serif';
  const w = Math.max(c.measureText(text).width, sub ? c.measureText(sub).width * 0.7 : 0) + 40;
  c.fillStyle = 'rgba(27,27,28,0.88)';
  const rx = (512 - w) / 2, rh = sub ? 92 : 62, ry = (128 - rh) / 2;
  c.beginPath(); c.roundRect(rx, ry, w, rh, 14); c.fill();
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, 256, sub ? ry + 32 : 64);
  if (sub) { c.font = '400 23px system-ui, sans-serif'; c.fillStyle = '#c9c9c9'; c.fillText(sub, 256, ry + 66); }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  sp.scale.set(5.2, 1.3, 1);
  sp.position.set(x, y, z);
  sp.renderOrder = 10;
  g.add(sp);
}

// ================================================================== SITE
box(G.site, -30, 46, -0.05, 0, -24, 40, C.ground);

// ================================================================== GROUND FLOOR
const g = G.ground;
// plinth (grey base) under the house and veranda
box(g, -0.1, W + 0.1, 0, PLINTH, -0.1, 14.5, C.grey);
box(g, 0, W, PLINTH, PLINTH + 0.02, 0, D, C.floor);                           // floor finish inside
box(g, 0, W, PLINTH, PLINTH + 0.02, D, 14.5, C.tile);                         // veranda floor
// five entrance steps
for (let i = 0; i < 5; i++) {
  const zf = 14.5 + (5 - i) * 0.3;
  box(g, 5, 11.5, 0, (i + 1) * 0.15, 14.5, zf, i % 2 ? 0xa7a9ab : C.grey);
}

const GB = PLINTH, T = 0.23, t = 0.15;
// --- exterior walls
// left wall: tall along the living hall (z 0..9), single storey along dining (z 9..12)
wall(g, 0, 0, 0, 9, GB, TOP - GB, T, [
  { at: 2.5, w: 1.6, y0: 0.9, y1: 2.4 }, { at: 6.5, w: 1.6, y0: 0.9, y1: 2.4 },
  { at: 2.5, w: 1.6, y0: 4.6, y1: 5.9 }, { at: 6.5, w: 1.6, y0: 4.6, y1: 5.9 }]);           // high windows to the hall
wall(g, 0, 9, 0, 12, GB, GF_H, T, [{ at: 1.5, w: 1.6, y0: 0.9, y1: 2.4 }]);
// back wall: tall behind the hall with a row of high clerestory windows
wall(g, 0, 0, 7.5, 0, GB, TOP - GB, T, [
  { at: 1.6, w: 1.6, y0: 0.9, y1: 2.4 }, { at: 5.9, w: 1.6, y0: 0.9, y1: 2.4 },
  { at: 1.6, w: 1.6, y0: 5.2, y1: 6.1 }, { at: 3.75, w: 1.6, y0: 5.2, y1: 6.1 }, { at: 5.9, w: 1.6, y0: 5.2, y1: 6.1 }]);
wall(g, 7.5, 0, W, 0, GB, GF_H, T, [{ at: 1.75, w: 1.4, y0: 1.1, y1: 2.2 }, { at: 5.25, w: 1.4, y0: 0.9, y1: 2.2 }, { at: 8.0, w: 1.0, y0: 0.9, y1: 2.2 }]);
// right wall
wall(g, W, 0, W, 12, GB, GF_H, T, [{ at: 2.0, w: 1.4, y0: 0.9, y1: 2.2 }, { at: 6.8, w: 1.4, y0: 0.9, y1: 2.2 }, { at: 10.5, w: 1.4, y0: 0.9, y1: 2.2 }]);
// front wall: dining windows, main door, Room 4 door and window
wall(g, 0, 12, W, 12, GB, GF_H, T, [
  { at: 2.0, w: 2.4, y0: 0.6, y1: 2.4 }, { at: 5.6, w: 2.4, y0: 0.6, y1: 2.4 },
  { at: 9.25, w: 1.6, y1: 2.6, kind: 'glassdoor' },                                          // main entrance
  { at: 12.4, w: 0.95, y1: 2.2, kind: 'door' }, { at: 14.9, w: 1.6, y0: 0.9, y1: 2.2 }]);    // Room 4

// --- interior walls, ground floor
// kitchen: half height wall with a door towards the hall, full walls elsewhere
wall(g, 7.5, 0, 7.5, 4.0, GB, 1.1, t, [{ at: 3.1, w: 0.9, y1: 1.1, kind: 'gap' }], C.wallIn);
wall(g, 7.5, 4.0, 11, 4.0, GB, GF_H, t, [{ at: 1.0, w: 0.9, kind: 'door' }], C.wallIn);
wall(g, 11, 0, 11, 3.8, GB, GF_H, t, [], C.wallIn);
// bedroom wing: corridor between Bedroom 2 and Bedroom 3, guest bedroom at its end
wall(g, 11, 3.8, 14.5, 3.8, GB, GF_H, t, [{ at: 1.2, w: 0.9, kind: 'door' }], C.wallIn);
wall(g, 11, 5.2, 14.5, 5.2, GB, GF_H, t, [{ at: 1.2, w: 0.9, kind: 'door' }], C.wallIn);
wall(g, 11, 5.2, 11, 9, GB, GF_H, t, [], C.wallIn);
wall(g, 14.5, 0, 14.5, 9, GB, GF_H, t, [{ at: 4.5, w: 0.9, kind: 'door' }], C.wallIn);
// Room 4: self contained, its own front door
wall(g, 11, 9, W, 9, GB, GF_H, t, [], C.wallIn);
wall(g, 11, 9, 11, 12, GB, GF_H, t, [], C.wallIn);

// --- grey feature panel around the entrance bay, full height, with a black frame line
box(g, 7.45, 8.45, PLINTH, TOP, 12.115, 12.16, C.grey);          // left of the main door
box(g, 10.05, 11.05, PLINTH, TOP, 12.115, 12.16, C.grey);         // right of it
box(g, 8.45, 10.05, PLINTH + 2.6, TOP, 12.115, 12.16, C.grey);    // above it
box(g, 7.4, 7.45, PLINTH, TOP, 12.1, 12.18, C.black, { noShadow: true });
box(g, 11.05, 11.1, PLINTH, TOP, 12.1, 12.18, C.black, { noShadow: true });

// --- columns holding the balcony over the veranda
[0.15, 5.5, 11, W - 0.15].forEach(x => box(g, x - 0.15, x + 0.15, PLINTH, UF - SLAB, 14.1, 14.4, C.wall));

// --- the square staircase in front of the kitchen (rises inside the hall area)
const RISE = (UF - PLINTH) / 21, TREAD = 0.28;
let lvl = PLINTH;
const step = (x0, x1, z0, z1, yTop) => box(g, x0, x1, PLINTH, yTop, z0, z1, 0xe6e6e3);
for (let i = 0; i < 8; i++) { lvl += RISE; step(9.8, 11, 8.0 - (i + 1) * TREAD, 8.0 - i * TREAD, lvl); }      // flight 1, towards the back
lvl += RISE; step(9.8, 11, 4.5, 8.0 - 8 * TREAD, lvl);                                                          // landing 1
for (let i = 0; i < 3; i++) { lvl += RISE; step(9.8 - (i + 1) * TREAD, 9.8 - i * TREAD, 4.5, 5.7, lvl); }      // flight 2, across
lvl += RISE; step(7.5, 9.8 - 3 * TREAD, 4.5, 5.7, lvl);                                                         // landing 2
for (let i = 0; i < 8; i++) { lvl += RISE; step(7.5, 8.7, 5.7 + i * TREAD, 5.7 + (i + 1) * TREAD, lvl); }      // flight 3, to the gallery
// black handrails along the open sides of the stairs
const hr = (x0, x1, y0, y1, z0, z1) => box(g, x0, x1, y0, y1, z0, z1, C.black, { noShadow: true });
hr(9.77, 9.81, PLINTH + 0.9, PLINTH + 0.95 + 8 * RISE, 5.76, 8.0);
hr(7.47, 7.51, PLINTH + 0.9 + 13 * RISE, UF + 0.95, 5.7, 7.95);

// ================================================================== FURNITURE AND FITTINGS (ground floor)
// helpers: a bed with its headboard against a wall, a wardrobe, a plant in a black pot
const WHITE_FAB = 0xf7f7f5, GREY_FAB = 0x8d9094;
function bed(gr, x0, x1, z0, z1, y, head) {        // head: 'z0' | 'z1' | 'x0' | 'x1'
  box(gr, x0, x1, y, y + 0.32, z0, z1, C.black);                                  // black base
  box(gr, x0 + 0.05, x1 - 0.05, y + 0.32, y + 0.55, z0 + 0.05, z1 - 0.05, WHITE_FAB); // white mattress
  const th = 0.1, hh = y + 1.15;
  if (head === 'z0') { box(gr, x0, x1, y, hh, z0 - th, z0, C.black); box(gr, x0 + 0.1, x1 - 0.1, y + 0.55, y + 0.72, z0 + 0.05, z0 + 0.45, GREY_FAB); }
  if (head === 'z1') { box(gr, x0, x1, y, hh, z1, z1 + th, C.black); box(gr, x0 + 0.1, x1 - 0.1, y + 0.55, y + 0.72, z1 - 0.45, z1 - 0.05, GREY_FAB); }
  if (head === 'x1') { box(gr, x1, x1 + th, y, hh, z0, z1, C.black); box(gr, x1 - 0.45, x1 - 0.05, y + 0.55, y + 0.72, z0 + 0.1, z1 - 0.1, GREY_FAB); }
  if (head === 'x0') { box(gr, x0 - th, x0, y, hh, z0, z1, C.black); box(gr, x0 + 0.05, x0 + 0.45, y + 0.55, y + 0.72, z0 + 0.1, z1 - 0.1, GREY_FAB); }
  // a grey throw across the foot of the bed
  if (head === 'z0') box(gr, x0 + 0.02, x1 - 0.02, y + 0.55, y + 0.58, z1 - 0.6, z1 - 0.02, GREY_FAB);
  if (head === 'z1') box(gr, x0 + 0.02, x1 - 0.02, y + 0.55, y + 0.58, z0 + 0.02, z0 + 0.6, GREY_FAB);
  if (head === 'x1') box(gr, x0 + 0.02, x0 + 0.6, y + 0.55, y + 0.58, z0 + 0.02, z1 - 0.02, GREY_FAB);
}
function wardrobe(gr, x0, x1, z0, z1, y) { box(gr, x0, x1, y, y + 2.3, z0, z1, C.black); }
function plant(gr, x, z, y, s) {
  s = s || 1;

  gallery: { pos: [7.0, UF + 1.75, 11.8], tgt: [2.4, PLINTH + 0.5, 1.5] },
  planG:   { pos: [8.25, 30, 6.35],  tgt: [8.25, 0, 6.3] },
  planU:   { pos: [8.25, 32, 6.35],  tgt: [8.25, 0, 6.3] },
};
// ------------------------------------------------------------------ animation engine: small tweens run in the render loop
const anims = [];
const ease = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
function tween(dur, step) {
  return new Promise(res => anims.push({ t0: performance.now(), dur, step, res }));
}
const wait = ms => new Promise(r => setTimeout(r, ms));

// fly the camera smoothly from where it is to a new position and target
function flyTo(pos, tgt, dur) {
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  const p1 = new THREE.Vector3(...pos), t1 = new THREE.Vector3(...tgt);
  return tween(dur || 1400, e => { camera.position.lerpVectors(p0, p1, e); controls.target.lerpVectors(t0, t1, e); });
}

function go(name, dur) {
  const v = views[name];
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === name));
  if (name === 'planG') { setExplode(false, true); setToggle('tUpper', false); setToggle('tRoof', false); setToggle('tLabels', true); G.labelsU.visible = false; }
  else if (name === 'planU') { setExplode(false, true); setToggle('tUpper', true); setToggle('tRoof', false); setToggle('tLabels', true); G.labelsG.visible = false; G.labelsU.visible = true; }
  else { setToggle('tUpper', true); setToggle('tRoof', true); if (name !== 'bird') setToggle('tLabels', false); }
  return flyTo(v.pos, v.tgt, dur);
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { stopTour(); go(b.dataset.view); });

function setToggle(id, on) {
  const b = document.getElementById(id); b.classList.toggle('on', on);
  if (id === 'tRoof') G.roof.visible = on;
  if (id === 'tUpper') { G.upper.visible = on; G.labelsU.visible = on && document.getElementById('tLabels').classList.contains('on'); if (!on) setToggle('tRoof', false); }
  if (id === 'tLabels') { G.labelsG.visible = on; G.labelsU.visible = on && G.upper.visible; }
}
['tRoof', 'tUpper', 'tLabels'].forEach(id => document.getElementById(id).onclick = () => {
  const on = !document.getElementById(id).classList.contains('on');
  if (id === 'tRoof' && on) setToggle('tUpper', true);
  setToggle(id, on);
});

// ------------------------------------------------------------------ day and night, with a slow fade between them
const DAY_BG = new THREE.Color(0xdfe6ec), NIGHT_BG = new THREE.Color(0x141a24);
const lampMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffd18a, emissiveIntensity: 0 });
LAMPS.forEach(l => { l.material = lampMat; });
let nightK = 0;
function applyNight(k) {
  nightK = k;
  scene.background.copy(DAY_BG).lerp(NIGHT_BG, k); scene.fog.color.copy(scene.background);
  sun.intensity = 2.2 + (0.12 - 2.2) * k; hemi.intensity = 1.1 + (0.18 - 1.1) * k; amb.intensity = 0.35 + (0.08 - 0.35) * k;
  ROOM_LIGHTS.forEach(l => { l.intensity = l.userData.day * (1 + 1.2 * k); l.color.setHex(0xfff4e6).lerp(new THREE.Color(0xffd6a0), k); });
  GLASS.emissive.setHex(0xffc77a); GLASS.emissiveIntensity = 0.55 * k; GLASS.opacity = 0.45 + 0.25 * k;
  lampMat.emissiveIntensity = 3 * k;
}
scene.background = DAY_BG.clone();
function setNight(on) {
  document.getElementById('tNight').classList.toggle('on', on);
  const from = nightK, to = on ? 1 : 0;
  return tween(1600, e => applyNight(from + (to - from) * e));
}
document.getElementById('tNight').onclick = () => setNight(nightK < 0.5);

// ------------------------------------------------------------------ open the house: lift the roof and the upper floor apart
let explodeK = 0;
function applyExplode(k) {
  explodeK = k;
  G.upper.position.y = 3.6 * k; G.labelsU.position.y = 3.6 * k;
  G.roof.position.y = 8.0 * k;
}
function setExplode(on, instant) {
  document.getElementById('tOpen').classList.toggle('on', on);
  if (on) { setToggle('tUpper', true); setToggle('tRoof', true); }
  const from = explodeK, to = on ? 1 : 0;
  if (instant) { applyExplode(to); return Promise.resolve(); }
  return tween(1500, e => applyExplode(from + (to - from) * e));
}
document.getElementById('tOpen').onclick = () => { stopTour(); setExplode(explodeK < 0.5); };

// ------------------------------------------------------------------ zoom, turn, auto turn, home
function zoom(f) {
  const off = camera.position.clone().sub(controls.target);
  const d = THREE.MathUtils.clamp(off.length() * f, 2, 120);
  off.setLength(d);
  const p = controls.target.clone().add(off);
  return flyTo([p.x, p.y, p.z], [controls.target.x, controls.target.y, controls.target.z], 450);
}
function turn(deg) {
  const off0 = camera.position.clone().sub(controls.target);
  const a = THREE.MathUtils.degToRad(deg);
  return tween(700, e => {
    const off = off0.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), a * e);
    camera.position.copy(controls.target).add(off);
  });
}
function setSpin(on) { controls.autoRotate = on; controls.autoRotateSpeed = 1.4; document.getElementById('bSpin').classList.toggle('on', on); }
document.getElementById('bIn').onclick = () => zoom(0.75);
document.getElementById('bOut').onclick = () => zoom(1.33);
document.getElementById('bLeft').onclick = () => turn(-35);
document.getElementById('bRight').onclick = () => turn(35);
document.getElementById('bSpin').onclick = () => setSpin(!controls.autoRotate);
document.getElementById('bHome').onclick = () => { stopTour(); setExplode(false); go('front'); };
addEventListener('keydown', e => {
  if (e.key === '+' || e.key === '=') zoom(0.75);
  if (e.key === '-' || e.key === '_') zoom(1.33);
  if (e.key === 'ArrowLeft') turn(-35);
  if (e.key === 'ArrowRight') turn(35);
});

// ------------------------------------------------------------------ guided tour
const caption = document.getElementById('help');
const HELP = caption.textContent;
let touring = 0;
const TOUR = [
  ['front', 'The front: entrance steps, covered veranda and the balcony above'],
  ['bird', 'From above: the house inside its compound'],
  ['open', 'Lift the floors apart to see how the house is stacked'],
  ['close', ''],
  ['planG', 'Ground floor: living hall, dining, kitchen, bedrooms and Room 4'],
  ['planU', 'Upper floor: open lounge, gallery, master suite and home office'],
  ['hall', 'Inside the double height living hall'],
  ['gallery', 'Looking down into the hall from the L shaped gallery'],
  ['night', 'The same house at night'],
  ['front', ''],
  ['day', ''],
];
async function playTour() {
  const id = ++touring;
  document.getElementById('bTour').classList.add('on');
  setSpin(false);
  for (const [step, text] of TOUR) {
    if (id !== touring) return;
    if (text) caption.textContent = text;
    if (step === 'open') { await go('bird', 900); await setExplode(true); await wait(1800); continue; }
    if (step === 'close') { await setExplode(false); continue; }
    if (step === 'night') { await setNight(true); await wait(1500); continue; }
    if (step === 'day') { await setNight(false); continue; }
    await go(step, 1800);
    if (id !== touring) return;
    await wait(2200);
  }
  if (id === touring) stopTour();
}
function stopTour() {
  touring++;
  document.getElementById('bTour').classList.remove('on');
  caption.textContent = HELP;
}
document.getElementById('bTour').onclick = () => (document.getElementById('bTour').classList.contains('on') ? stopTour() : playTour());
renderer.domElement.addEventListener('pointerdown', () => { if (document.getElementById('bTour').classList.contains('on')) stopTour(); });

// ------------------------------------------------------------------ start
setToggle('tLabels', false);
applyNight(0);
camera.position.set(9, 26, 70); controls.target.set(8.2, 3.6, 6);
go('front', 2200);                                   // a short fly in when the page opens
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(now => {
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i];
    const k = Math.min(1, (performance.now() - a.t0) / a.dur);
    a.step(ease(k));
    if (k >= 1) { anims.splice(i, 1); a.res(); }
  }
  controls.update();
  renderer.render(scene, camera);
});
window.__house = { go, setToggle, setNight, setExplode, zoom, turn, playTour, G };
</script>
